<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Stop & Bingo</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg-1:#0d0d1a;
    --bg-2:#1a1a2e;
    --bg-3:#16213e;
    --rosa:#e94560;
    --rosa-esc:#8f2440;
    --laranja:#f4a261;
    --agua:#4ecdc4;
    --dourado:#ffd700;
    --texto:#f4f4fb;
    --texto-fraco:#a9a9c2;
    --vidro:rgba(255,255,255,0.06);
    --vidro-borda:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    color:var(--texto);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    background:
      radial-gradient(circle at 12% 18%, rgba(233,69,96,0.22), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(78,205,196,0.20), transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(255,215,0,0.08), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-3), var(--bg-2));
    background-size:200% 200%, 200% 200%, 200% 200%, 300% 300%;
    animation:bgFlow 22s ease-in-out infinite;
  }
  @keyframes bgFlow{
    0%{background-position:0% 0%, 100% 100%, 50% 100%, 0% 50%;}
    50%{background-position:100% 100%, 0% 0%, 50% 0%, 100% 50%;}
    100%{background-position:0% 0%, 100% 100%, 50% 100%, 0% 50%;}
  }

  /* partículas flutuantes de fundo */
  #particulas{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .particula{
    position:absolute; bottom:-40px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.5), transparent 70%);
    animation:subir linear infinite;
  }
  @keyframes subir{
    from{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.7;}
    90%{opacity:0.5;}
    to{transform:translateY(-115vh) translateX(var(--drift,20px)); opacity:0;}
  }

  #app{min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;}
  .tela{display:none; flex:1; flex-direction:column; align-items:center; padding:24px;}
  .tela.active{display:flex; animation:entrarTela .55s cubic-bezier(.2,.8,.3,1);}
  @keyframes entrarTela{
    from{opacity:0; transform:translateY(18px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  h1{
    font-size:2.6rem; margin-bottom:8px; text-align:center; font-weight:800;
    background:linear-gradient(90deg, var(--rosa), var(--laranja), var(--dourado), var(--rosa));
    background-size:300% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:brilharTitulo 6s linear infinite;
  }
  @keyframes brilharTitulo{ to{ background-position:300% center; } }
  h2{font-size:1.7rem; margin-bottom:20px; text-align:center; color:var(--texto);}
  h3{font-size:1.1rem; margin-bottom:12px; color:var(--agua); letter-spacing:.3px;}

  /* ---------- Botões ---------- */
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px;
    color:var(--texto); font-weight:600; position:relative; overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  button:active{transform:translateY(2px);}
  .ripple{
    position:absolute; border-radius:50%; transform:scale(0);
    background:rgba(255,255,255,0.45); pointer-events:none;
    animation:rippleAnim .6s ease-out forwards;
  }
  @keyframes rippleAnim{ to{ transform:scale(4); opacity:0; } }

  .btn-primario{
    padding:14px 28px; font-size:1.05rem;
    background:linear-gradient(135deg, var(--rosa), var(--rosa-esc));
    box-shadow:0 6px 0 #6e1c33, 0 10px 22px rgba(233,69,96,0.4);
  }
  .btn-primario:hover{filter:brightness(1.12); transform:translateY(-2px); box-shadow:0 8px 0 #6e1c33, 0 14px 26px rgba(233,69,96,0.5);}
  .btn-secundario{
    padding:12px 22px; font-size:0.95rem;
    background:var(--vidro); border:1px solid var(--vidro-borda);
    box-shadow:0 4px 0 rgba(0,0,0,0.25); backdrop-filter:blur(6px);
  }
  .btn-secundario:hover{background:rgba(255,255,255,0.14); transform:translateY(-2px);}
  .btn-perigo{background:linear-gradient(135deg,#e94560,#7a1f31); box-shadow:0 4px 0 #5e1626;}
  .btn-perigo:hover{filter:brightness(1.1);}
  .btn-ouro{
    background:linear-gradient(135deg, var(--dourado), #b8860b); color:#2a1e00;
    box-shadow:0 4px 0 #8a6300, 0 10px 20px rgba(255,215,0,0.25);
  }
  .btn-ouro:hover{filter:brightness(1.08); transform:translateY(-2px);}

  /* ---------- Menu ---------- */
  #tela-menu{justify-content:center; gap:26px;}
  #tela-menu p{color:var(--texto-fraco); margin-bottom:6px; animation:fadeIn .8s ease;}
  .menu-opcoes{display:flex; gap:26px; flex-wrap:wrap; justify-content:center;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .btn-menu{
    width:190px; height:190px; border-radius:26px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:var(--vidro); border:1px solid var(--vidro-borda); backdrop-filter:blur(10px);
    box-shadow:0 12px 32px rgba(0,0,0,0.4);
    font-size:2.8rem; animation:apareceMenu .6s cubic-bezier(.2,.9,.3,1.2) backwards;
  }
  .btn-menu:nth-child(1){animation-delay:.05s;}
  .btn-menu:nth-child(2){animation-delay:.2s;}
  @keyframes apareceMenu{ from{opacity:0; transform:translateY(30px) scale(.85);} to{opacity:1; transform:translateY(0) scale(1);} }
  .btn-menu span{font-size:1rem; color:var(--texto-fraco); font-weight:500;}
  .btn-menu:hover{
    border-color:var(--agua); transform:translateY(-6px) scale(1.04) rotate(-1deg);
    box-shadow:0 20px 40px rgba(78,205,196,0.3);
  }

  /* ---------- Config ---------- */
  #tela-config{gap:20px; width:100%; max-width:720px; margin:0 auto;}
  .card{
    width:100%; background:var(--vidro); border:1px solid var(--vidro-borda); border-radius:18px;
    padding:20px; backdrop-filter:blur(10px); animation:entrarCard .5s ease backwards;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{box-shadow:0 8px 26px rgba(0,0,0,0.3);}
  @keyframes entrarCard{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  .add-jogador{display:flex; gap:10px; margin-bottom:14px;}
  .add-jogador input{flex:1;}
  input, select{
    padding:12px 14px; border-radius:10px; border:1px solid var(--vidro-borda);
    background:rgba(255,255,255,0.05); color:var(--texto); font-size:1rem; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus{border-color:var(--agua); box-shadow:0 0 0 3px rgba(78,205,196,0.2);}
  #lista-jogadores{list-style:none; display:flex; flex-direction:column; gap:8px;}
  #lista-jogadores li{
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,255,255,0.05); padding:10px 14px; border-radius:10px;
    animation:entrarLista .35s ease backwards;
  }
  @keyframes entrarLista{ from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:translateX(0);} }
  #lista-jogadores button{
    background:transparent; color:var(--rosa); font-size:1.1rem; padding:2px 8px; border-radius:8px;
  }
  #lista-jogadores button:hover{background:rgba(233,69,96,0.2);}
  .temas-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; margin-bottom:14px;}
  .tema-chip{
    text-align:center; padding:10px 6px; border-radius:10px; font-size:0.85rem;
    background:rgba(255,255,255,0.05); border:1px solid var(--vidro-borda); color:var(--texto-fraco);
    transition:all .2s ease;
  }
  .tema-chip.ativo{
    border-color:var(--agua); color:var(--texto); background:rgba(78,205,196,0.15);
    box-shadow:0 0 14px rgba(78,205,196,0.35);
  }
  label{display:block; margin-top:8px; font-size:0.9rem; color:var(--texto-fraco);}
  label select{width:100%; margin-top:6px;}
  .config-botoes{display:flex; gap:12px; justify-content:space-between; width:100%;}

  /* ---------- Tela de Jogo ---------- */
  #tela-jogo{width:100%; align-items:stretch; padding:0;}
  .admin-view{display:flex; flex-wrap:wrap; gap:24px; padding:24px; max-width:1200px; margin:0 auto; width:100%;}
  .roleta-coluna{flex:1; min-width:320px; display:flex; flex-direction:column; align-items:center; gap:18px;}

  .roleta-wrap{
    position:relative; width:min(380px, 82vw); height:min(380px, 82vw);
    display:flex; align-items:center; justify-content:center;
  }
  .luzes{position:absolute; inset:0;}
  .luz{
    position:absolute; width:10px; height:10px; border-radius:50%; top:50%; left:50%;
    background:var(--dourado); box-shadow:0 0 8px 2px rgba(255,215,0,0.7);
    animation:piscar 1.6s ease-in-out infinite;
    transform:translate(-50%,-50%);
  }
  .luz.girando{animation-duration:.35s;}
  @keyframes piscar{ 0%,100%{opacity:.25; box-shadow:0 0 4px 1px rgba(255,215,0,0.4);} 50%{opacity:1; box-shadow:0 0 12px 4px rgba(255,215,0,0.9);} }

  .anel-glow{
    position:absolute; inset:6%; border-radius:50%;
    box-shadow:0 0 40px 10px rgba(233,69,96,0.35), 0 0 70px 20px rgba(78,205,196,0.15);
    animation:respirar 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes respirar{ 0%,100%{opacity:.6; transform:scale(1);} 50%{opacity:1; transform:scale(1.03);} }

  #roleta-canvas{
    position:relative; width:78%; height:78%; border-radius:50%;
    box-shadow:0 0 0 6px #0d0d1a, 0 0 0 9px var(--dourado), 0 10px 40px rgba(0,0,0,0.6);
    transition: transform 4.2s cubic-bezier(0.12, 0.85, 0.18, 1);
    z-index:2;
  }
  .ponteiro{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:6;
    border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:28px solid var(--dourado);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.6));
    animation:apontarPulso 1.4s ease-in-out infinite;
  }
  @keyframes apontarPulso{ 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(3px);} }

  .info-jogo{display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center;}
  .perspectiva-letra{perspective:600px;}
  .letra-display{
    font-size:3rem; font-weight:800; width:80px; height:80px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--rosa), var(--laranja)); box-shadow:0 6px 18px rgba(233,69,96,0.4);
    transform-style:preserve-3d;
  }
  .letra-display.flip{ animation:flipLetra .7s ease; }
  @keyframes flipLetra{
    0%{transform:rotateY(0deg) scale(1);}
    45%{transform:rotateY(95deg) scale(1.08); background:linear-gradient(135deg, var(--dourado), var(--laranja));}
    55%{transform:rotateY(95deg) scale(1.08); background:linear-gradient(135deg, var(--dourado), var(--laranja));}
    100%{transform:rotateY(360deg) scale(1);}
  }
  .tema-display{font-size:1.2rem; font-weight:600; color:var(--agua); transition:transform .2s ease;}
  .tema-display.pulso{ animation:pulsoTexto .4s ease; }
  @keyframes pulsoTexto{ 50%{ transform:scale(1.15); color:var(--dourado); } }
  .rodada-display{font-size:1rem; color:var(--texto-fraco); background:var(--vidro); padding:6px 12px; border-radius:8px; transition:transform .2s ease;}
  .rodada-display.pulso{ animation:pulsoTexto .4s ease; }

  .painel-admin{flex:1; min-width:320px; display:flex; flex-direction:column; gap:16px;}
  .linha{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .status-lista{display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto;}
  .status-item{
    background:rgba(255,255,255,0.05); border-radius:10px; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    animation:entrarLista .3s ease backwards; transition:background .2s ease;
  }
  .status-item:hover{background:rgba(255,255,255,0.09);}
  .status-item .nome{font-weight:600;}
  .status-item .pontos{color:var(--dourado); font-weight:700;}
  .status-item .detalhe{font-size:0.8rem; color:var(--texto-fraco); width:100%;}
  .botoes-globais{display:flex; gap:10px; margin-top:auto; padding-top:10px;}
  .notificacao{
    background:rgba(255,215,0,0.14); border:1px solid var(--dourado); border-radius:10px;
    padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px;
    animation:entrarDireita .35s ease;
  }
  @keyframes entrarDireita{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);} }

  /* ---------- Modo Jogador ---------- */
  .player-view{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    padding:24px; text-align:center;
  }
  .letra-display-player{
    font-size:6rem; font-weight:900; width:160px; height:160px; border-radius:30px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--rosa), var(--laranja));
    box-shadow:0 12px 34px rgba(233,69,96,0.5);
    transform-style:preserve-3d;
  }
  .letra-display-player.flip{ animation:flipLetra .7s ease; }
  .tema-display-player{font-size:1.7rem; font-weight:700; color:var(--agua);}
  .tema-display-player.pulso{ animation:pulsoTexto .4s ease; }
  .botoes-pontos{display:flex; gap:16px;}
  .btn-ponto{
    width:92px; height:92px; border-radius:50%; font-size:1.7rem; font-weight:800;
    background:var(--vidro); border:2px solid var(--vidro-borda); box-shadow:0 6px 0 rgba(0,0,0,0.3);
  }
  .btn-ponto:hover{transform:translateY(-3px);}
  .btn-ponto.selecionado{
    background:linear-gradient(135deg,var(--agua),#2a9d8f); border-color:var(--agua);
    animation:selecionarPonto .35s ease;
  }
  @keyframes selecionarPonto{ 50%{ transform:scale(1.15); } }
  .envio-palavra{display:flex; gap:10px; width:100%; max-width:340px;}
  .envio-palavra input{flex:1; text-align:center;}
  .btn-bingo-grande{
    padding:22px 40px; font-size:1.5rem; border-radius:20px;
    background:linear-gradient(135deg, var(--dourado), #b8860b); color:#2a1e00;
    box-shadow:0 8px 0 #8a6300, 0 14px 28px rgba(255,215,0,0.35);
    animation:pulsarBingo 2s ease-in-out infinite;
  }
  @keyframes pulsarBingo{ 0%,100%{box-shadow:0 8px 0 #8a6300, 0 14px 28px rgba(255,215,0,0.35);} 50%{box-shadow:0 8px 0 #8a6300, 0 18px 40px rgba(255,215,0,0.6);} }
  #palavras-enviadas-player{display:flex; flex-direction:column; gap:6px; max-width:320px; width:100%;}
  .palavra-chip{background:var(--vidro); border-radius:8px; padding:8px 12px; font-size:0.9rem; animation:entrarLista .3s ease;}

  /* ---------- Pódio ---------- */
  #tela-podio{justify-content:flex-start; gap:24px; padding-top:40px;}
  #podio-container{display:flex; flex-direction:column; gap:12px; width:100%; max-width:520px;}
  .podio-item{
    display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:16px;
    background:var(--vidro); border:1px solid var(--vidro-borda); opacity:0; transform:translateX(-30px);
    animation:entrarPodio .55s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @keyframes entrarPodio{to{opacity:1; transform:translateX(0);}}
  .podio-item .posicao{font-size:1.5rem; font-weight:800; width:36px; text-align:center;}
  .podio-item .nome{flex:1; font-weight:700; font-size:1.1rem;}
  .podio-item .pontos{font-weight:800; color:var(--dourado);}
  .podio-item.ouro{border-color:var(--dourado); box-shadow:0 0 26px rgba(255,215,0,0.4); animation:entrarPodio .55s cubic-bezier(.2,.9,.3,1.2) forwards, brilharOuro 2s ease-in-out infinite 1s;}
  @keyframes brilharOuro{ 0%,100%{box-shadow:0 0 26px rgba(255,215,0,0.4);} 50%{box-shadow:0 0 40px rgba(255,215,0,0.65);} }
  .podio-item.prata{border-color:#c0c0c0; box-shadow:0 0 18px rgba(192,192,192,0.25);}
  .podio-item.bronze{border-color:#cd7f32; box-shadow:0 0 18px rgba(205,127,50,0.25);}

  #confetti-container{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
  .confete{position:absolute; top:-20px; border-radius:2px; animation:cair linear forwards;}
  @keyframes cair{to{transform:translateY(110vh) rotate(720deg); opacity:0.15;}}

  /* ---------- Responsividade: modo jogador em telas pequenas ---------- */
  @media (max-width: 768px){ .admin-view{display:none;} }
  @media (min-width: 769px){ .player-view{display:none;} }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--vidro-borda); border-radius:8px;}
</style>
</head>
<body>
<div id="particulas"></div>
<div id="app">

  <!-- TELA 1: MENU -->
  <div id="tela-menu" class="tela active">
    <h1>🎉 Stop &amp; Bingo</h1>
    <p>Escolha o jogo para começar</p>
    <div class="menu-opcoes">
      <button class="btn-menu" data-jogo="stop">🛑<span>Stop</span></button>
      <button class="btn-menu" data-jogo="bingo">🎰<span>Bingo</span></button>
    </div>
  </div>

  <!-- TELA 2: CONFIGURAÇÃO -->
  <div id="tela-config" class="tela">
    <h2 id="config-titulo">Configuração</h2>

    <div class="card">
      <h3>👥 Jogadores</h3>
      <div class="add-jogador">
        <input id="input-jogador" placeholder="Nome do jogador" maxlength="20"/>
        <button class="btn-primario" id="btn-add-jogador">Adicionar</button>
      </div>
      <ul id="lista-jogadores"></ul>
    </div>

    <div class="card config-especifica" id="config-stop" style="display:none">
      <h3>🎯 Temas do Stop</h3>
      <div class="temas-grid" id="temas-grid-stop"></div>
      <label>Tema inicial
        <select id="select-tema-inicial-stop"></select>
      </label>
    </div>

    <div class="card config-especifica" id="config-bingo" style="display:none">
      <h3>🎯 Tema do Bingo</h3>
      <select id="select-tema-bingo" style="width:100%"></select>
    </div>

    <div class="config-botoes">
      <button class="btn-secundario" id="btn-voltar-menu">⬅ Voltar</button>
      <button class="btn-primario" id="btn-iniciar-jogo">🚀 Iniciar Jogo</button>
    </div>
  </div>

  <!-- TELA 3: JOGO -->
  <div id="tela-jogo" class="tela">

    <!-- MODO ADMINISTRADOR (computador, largura >= 769px) -->
    <div class="admin-view">
      <div class="roleta-coluna">
        <div class="roleta-wrap">
          <div class="anel-glow"></div>
          <div class="luzes" id="luzes"></div>
          <div class="ponteiro"></div>
          <canvas id="roleta-canvas" width="500" height="500"></canvas>
        </div>
        <div class="info-jogo">
          <div class="perspectiva-letra"><div class="letra-display" id="admin-letra">-</div></div>
          <div>
            <div class="tema-display" id="admin-tema">-</div>
            <div class="rodada-display" id="admin-rodada">Rodada 1</div>
          </div>
        </div>
        <button class="btn-primario" id="btn-girar">🎡 Girar Roleta</button>
      </div>

      <div class="painel-admin">
        <!-- Painel STOP -->
        <div id="painel-stop-admin" style="display:none">
          <div class="card">
            <h3>⚙️ Controles</h3>
            <div class="linha">
              <select id="select-mudar-tema-stop"></select>
              <button class="btn-secundario" id="btn-alterar-tema-stop">Alterar</button>
            </div>
            <div class="linha" style="margin-top:12px;">
              <button class="btn-secundario" id="btn-proxima-rodada">⏭ Próxima rodada</button>
              <button class="btn-perigo" id="btn-zerar-pontos">🔄 Zerar pontos</button>
            </div>
          </div>
          <div class="card" style="margin-top:16px;">
            <h3>📊 Status</h3>
            <div class="status-lista" id="status-stop"></div>
          </div>
        </div>

        <!-- Painel BINGO -->
        <div id="painel-bingo-admin" style="display:none">
          <div class="card">
            <h3>⚙️ Controles</h3>
            <p style="margin-bottom:10px;">Tema atual: <strong id="bingo-tema-admin" style="color:var(--agua);">-</strong></p>
            <div class="linha">
              <button class="btn-primario" id="btn-validar-bingo">✅ Validar Bingo</button>
              <button class="btn-perigo" id="btn-limpar-palavras">🗑️ Limpar palavras</button>
            </div>
          </div>
          <div class="card" id="card-notificacoes" style="margin-top:16px; display:none;">
            <h3>🔔 Solicitações de Bingo</h3>
            <div id="notificacoes-lista"></div>
          </div>
          <div class="card" style="margin-top:16px;">
            <h3>📊 Status</h3>
            <div class="status-lista" id="status-bingo"></div>
          </div>
        </div>

        <div class="botoes-globais">
          <button class="btn-ouro" id="btn-finalizar">🏁 Finalizar</button>
          <button class="btn-secundario" id="btn-config">⬅ Config</button>
        </div>
      </div>
    </div>

    <!-- MODO JOGADOR (celular, largura < 769px) -->
    <div class="player-view">
      <div class="perspectiva-letra"><div class="letra-display-player" id="player-letra">-</div></div>
      <div class="tema-display-player" id="player-tema">-</div>

      <div id="player-stop" style="display:none">
        <div class="botoes-pontos">
          <button class="btn-ponto" data-pontos="10">10</button>
          <button class="btn-ponto" data-pontos="5">5</button>
          <button class="btn-ponto" data-pontos="0">0</button>
        </div>
      </div>

      <div id="player-bingo" style="display:none">
        <div class="envio-palavra">
          <input id="input-palavra" placeholder="Digite a palavra" maxlength="30"/>
          <button class="btn-primario" id="btn-enviar-palavra">Enviar</button>
        </div>
        <div id="palavras-enviadas-player"></div>
        <button class="btn-bingo-grande" id="btn-bingo">🎰 BINGO!</button>
      </div>
    </div>
  </div>

  <!-- TELA 4: PÓDIO -->
  <div id="tela-podio" class="tela">
    <h1>🏆 Pódio Final</h1>
    <div id="podio-container"></div>
    <button class="btn-primario" id="btn-reiniciar">⬅ Voltar ao início</button>
  </div>

</div>
<div id="confetti-container"></div>

<script>
const socket = io();
const TEMAS = ['Person','Food','Place','Color','Job','Verb','Object','Animal'];
const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let estado = null;
let currentRotation = 0;
let ultimaLetraGirada = null;
let jogoSelecionadoConfig = null;

// ---------- Partículas de fundo ----------
(function criarParticulas(){
  const cont = document.getElementById('particulas');
  const n = 22;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particula';
    const tamanho = 3 + Math.random()*7;
    p.style.width = tamanho+'px';
    p.style.height = tamanho+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.setProperty('--drift', (Math.random()*80-40)+'px');
    p.style.animationDuration = (10 + Math.random()*14)+'s';
    p.style.animationDelay = (Math.random()*14)+'s';
    cont.appendChild(p);
  }
})();

// ---------- Ripple em todos os botões ----------
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size + 'px';
  span.style.left = (e.clientX - rect.left - size/2) + 'px';
  span.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(span);
  setTimeout(() => span.remove(), 650);
});

// ---------- Utilidades de nome do jogador (localStorage) ----------
function getMeuNome(){
  let nome = localStorage.getItem('sb_nome_jogador');
  if(!nome){
    nome = (prompt('Digite seu nome:') || '').trim();
    if(nome) localStorage.setItem('sb_nome_jogador', nome);
  }
  return nome;
}

// ---------- Navegação entre telas ----------
function mostrarTela(id){
  document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ---------- TELA MENU ----------
document.querySelectorAll('.btn-menu').forEach(btn => {
  btn.addEventListener('click', () => {
    jogoSelecionadoConfig = btn.dataset.jogo;
    prepararTelaConfig();
    mostrarTela('tela-config');
  });
});

// ---------- TELA CONFIG ----------
function prepararTelaConfig(){
  document.getElementById('config-titulo').textContent =
    jogoSelecionadoConfig === 'stop' ? '🛑 Configurar Stop' : '🎰 Configurar Bingo';

  document.getElementById('config-stop').style.display = jogoSelecionadoConfig === 'stop' ? 'block' : 'none';
  document.getElementById('config-bingo').style.display = jogoSelecionadoConfig === 'bingo' ? 'block' : 'none';

  const gridTemas = document.getElementById('temas-grid-stop');
  gridTemas.innerHTML = TEMAS.map((t,i) => `<div class="tema-chip" data-tema="${t}" style="animation-delay:${i*0.04}s">${t}</div>`).join('');

  const selInicial = document.getElementById('select-tema-inicial-stop');
  selInicial.innerHTML = TEMAS.map(t => `<option value="${t}">${t}</option>`).join('');
  destacarChipTema(selInicial.value);
  selInicial.addEventListener('change', () => destacarChipTema(selInicial.value));

  const selBingo = document.getElementById('select-tema-bingo');
  selBingo.innerHTML = TEMAS.map(t => `<option value="${t}">${t}</option>`).join('');
}
function destacarChipTema(tema){
  document.querySelectorAll('#temas-grid-stop .tema-chip').forEach(c => {
    c.classList.toggle('ativo', c.dataset.tema === tema);
  });
}

document.getElementById('btn-voltar-menu').addEventListener('click', () => mostrarTela('tela-menu'));

document.getElementById('btn-add-jogador').addEventListener('click', adicionarJogadorConfig);
document.getElementById('input-jogador').addEventListener('keydown', e => {
  if(e.key === 'Enter') adicionarJogadorConfig();
});
function adicionarJogadorConfig(){
  const input = document.getElementById('input-jogador');
  const nome = input.value.trim();
  if(!nome) return;
  socket.emit('adicionar_jogador', nome);
  input.value = '';
}

document.getElementById('btn-iniciar-jogo').addEventListener('click', () => {
  if(!jogoSelecionadoConfig) return;
  socket.emit('set_jogo', jogoSelecionadoConfig);
  if(jogoSelecionadoConfig === 'stop'){
    socket.emit('mudar_tema_stop', document.getElementById('select-tema-inicial-stop').value);
  } else {
    socket.emit('set_tema_bingo', document.getElementById('select-tema-bingo').value);
  }
  mostrarTela('tela-jogo');
});

// ---------- TELA JOGO: controles ADMIN ----------
const btnGirar = document.getElementById('btn-girar');
btnGirar.addEventListener('click', () => {
  btnGirar.disabled = true;
  socket.emit('girar_roleta');
  setTimeout(() => { btnGirar.disabled = false; }, 4300);
});

const selMudarTemaStop = document.getElementById('select-mudar-tema-stop');
selMudarTemaStop.innerHTML = TEMAS.map(t => `<option value="${t}">${t}</option>`).join('');
document.getElementById('btn-alterar-tema-stop').addEventListener('click', () => {
  socket.emit('mudar_tema_stop', selMudarTemaStop.value);
});
document.getElementById('btn-proxima-rodada').addEventListener('click', () => socket.emit('proxima_rodada_stop'));
document.getElementById('btn-zerar-pontos').addEventListener('click', () => {
  if(confirm('Zerar todos os pontos do Stop?')) socket.emit('zerar_pontos_stop');
});

document.getElementById('btn-validar-bingo').addEventListener('click', () => {
  const nome = prompt('Nome do jogador que pediu BINGO:');
  if(nome && nome.trim()) socket.emit('validar_bingo', nome.trim());
});
document.getElementById('btn-limpar-palavras').addEventListener('click', () => {
  if(confirm('Limpar todas as palavras enviadas?')) socket.emit('limpar_palavras_bingo');
});

document.getElementById('btn-finalizar').addEventListener('click', () => {
  if(confirm('Finalizar o jogo e abrir o pódio?')) socket.emit('finalizar_jogo');
});
document.getElementById('btn-config').addEventListener('click', () => {
  if(confirm('Voltar para a configuração? O jogo atual continua salvo no servidor.')){
    mostrarTela('tela-config');
  }
});

document.getElementById('btn-reiniciar').addEventListener('click', () => {
  socket.emit('reiniciar_jogo');
  mostrarTela('tela-menu');
});

// ---------- TELA JOGO: controles JOGADOR ----------
document.querySelectorAll('.btn-ponto').forEach(btn => {
  btn.addEventListener('click', () => {
    const nome = getMeuNome();
    if(!nome) return;
    document.querySelectorAll('.btn-ponto').forEach(b => b.classList.remove('selecionado'));
    btn.classList.add('selecionado');
    socket.emit('marcar_ponto_stop', { nome, pontos: Number(btn.dataset.pontos) });
  });
});

document.getElementById('btn-enviar-palavra').addEventListener('click', enviarPalavra);
document.getElementById('input-palavra').addEventListener('keydown', e => {
  if(e.key === 'Enter') enviarPalavra();
});
function enviarPalavra(){
  const nome = getMeuNome();
  if(!nome) return;
  const input = document.getElementById('input-palavra');
  const palavra = input.value.trim();
  if(!palavra) return;
  socket.emit('enviar_palavra_bingo', { nome, palavra });
  input.value = '';
}

document.getElementById('btn-bingo').addEventListener('click', () => {
  const nome = getMeuNome();
  if(!nome) return;
  socket.emit('solicitar_validacao_bingo', { nome });
  alert('Solicitação de BINGO enviada ao administrador! 🎉');
});

// ---------- ROLETA (canvas + luzes) ----------
const canvas = document.getElementById('roleta-canvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = 500 * dpr;
canvas.height = 500 * dpr;
ctx.scale(dpr, dpr);

function desenharRoleta(){
  const tamanho = 500;
  const cx = tamanho/2, cy = tamanho/2, raio = tamanho/2 - 6;
  const sliceAngle = (Math.PI*2)/26;
  ctx.clearRect(0,0,tamanho,tamanho);
  for(let i=0;i<26;i++){
    const start = -Math.PI/2 + i*sliceAngle;
    const end = start + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,raio,start,end);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#f4f4fb' : '#e94560';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    const mid = start + sliceAngle/2;
    const lx = cx + Math.cos(mid) * raio * 0.8;
    const ly = cy + Math.sin(mid) * raio * 0.8;
    ctx.save();
    ctx.translate(lx,ly);
    ctx.rotate(mid + Math.PI/2);
    ctx.fillStyle = i % 2 === 0 ? '#1a1a2e' : '#ffffff';
    ctx.font = 'bold 22px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 3;
    ctx.fillText(LETRAS[i], 0, 0);
    ctx.restore();
  }
  // centro dourado
  const grad = ctx.createRadialGradient(cx,cy,4,cx,cy,32);
  grad.addColorStop(0, '#fff4c2');
  grad.addColorStop(1, '#ffd700');
  ctx.beginPath();
  ctx.arc(cx,cy,30,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 3;
  ctx.stroke();
}
desenharRoleta();

// luzes ao redor da roleta
const luzesContainer = document.getElementById('luzes');
const NUM_LUZES = 24;
for(let i=0;i<NUM_LUZES;i++){
  const ang = (i / NUM_LUZES) * Math.PI * 2;
  const raioPct = 48; // % do raio do wrap
  const x = 50 + raioPct * Math.cos(ang);
  const y = 50 + raioPct * Math.sin(ang);
  const luz = document.createElement('div');
  luz.className = 'luz';
  luz.style.left = x + '%';
  luz.style.top = y + '%';
  luz.style.animationDelay = (i * (1.6/NUM_LUZES)) + 's';
  luzesContainer.appendChild(luz);
}

function setLuzesGirando(ativo){
  document.querySelectorAll('.luz').forEach(l => l.classList.toggle('girando', ativo));
}

function girarPara(letra){
  const idx = LETRAS.indexOf(letra);
  if(idx < 0) return;
  const sliceAngleDeg = 360/26;
  const midDeg = -90 + idx*sliceAngleDeg + sliceAngleDeg/2;
  let deltaMod = ((-90 - midDeg) % 360 + 360) % 360;
  const voltas = 5 + Math.floor(Math.random()*8); // 5 a 12 voltas
  const baseAtual = currentRotation - (currentRotation % 360);
  let alvo = baseAtual + voltas*360 + deltaMod;
  if(alvo <= currentRotation) alvo += 360;
  currentRotation = alvo;
  setLuzesGirando(true);
  canvas.style.transform = `rotate(${currentRotation}deg)`;
  setTimeout(() => setLuzesGirando(false), 4300);
}

// ---------- Animações auxiliares de texto ----------
function flipTexto(el, novoValor){
  if(!el) return;
  const atual = el.textContent;
  el.textContent = novoValor;
  if(atual !== novoValor){
    el.classList.remove('flip');
    void el.offsetWidth; // força reflow para reiniciar a animação
    el.classList.add('flip');
  }
}
function pulsarTexto(el, novoValor){
  if(!el) return;
  const atual = el.textContent;
  el.textContent = novoValor;
  if(atual !== novoValor){
    el.classList.remove('pulso');
    void el.offsetWidth;
    el.classList.add('pulso');
  }
}

// ---------- Renderização do estado ----------
function aplicarEstado(novoEstado){
  estado = novoEstado;

  flipTexto(document.getElementById('admin-letra'), estado.letraAtual || '-');
  flipTexto(document.getElementById('player-letra'), estado.letraAtual || '-');
  pulsarTexto(document.getElementById('admin-tema'), estado.temaAtual || '-');
  pulsarTexto(document.getElementById('player-tema'), estado.temaAtual || '-');
  pulsarTexto(document.getElementById('admin-rodada'), 'Rodada ' + estado.rodada);

  if(estado.letraAtual && estado.letraAtual !== ultimaLetraGirada){
    ultimaLetraGirada = estado.letraAtual;
    girarPara(estado.letraAtual);
  }

  const ehStop = estado.jogo === 'stop';
  document.getElementById('painel-stop-admin').style.display = ehStop ? 'block' : 'none';
  document.getElementById('painel-bingo-admin').style.display = ehStop ? 'none' : 'block';
  document.getElementById('player-stop').style.display = ehStop ? 'block' : 'none';
  document.getElementById('player-bingo').style.display = ehStop ? 'none' : 'block';

  if(!ehStop){
    document.getElementById('bingo-tema-admin').textContent = estado.temaAtual || '-';
  }

  const lista = document.getElementById('lista-jogadores');
  lista.innerHTML = estado.jogadores.map((j,i) => `
    <li style="animation-delay:${i*0.04}s">
      <span>${j.nome}</span>
      <button data-nome="${j.nome}" class="btn-remover-jogador">✕</button>
    </li>
  `).join('') || '<li style="justify-content:center; color:var(--texto-fraco);">Nenhum jogador ainda</li>';
  document.querySelectorAll('.btn-remover-jogador').forEach(btn => {
    btn.addEventListener('click', () => socket.emit('remover_jogador', btn.dataset.nome));
  });

  const statusStop = document.getElementById('status-stop');
  statusStop.innerHTML = estado.jogadores.map((j,i) => {
    const detalhe = TEMAS.map(t => `${t}: ${j.pontosStop[t] || 0}`).join(' · ');
    return `<div class="status-item" style="animation-delay:${i*0.04}s">
      <div>
        <div class="nome">${j.nome}</div>
        <div class="detalhe">${detalhe}</div>
      </div>
      <div class="pontos">${j.totalStop} pts</div>
    </div>`;
  }).join('') || '<p style="color:var(--texto-fraco);">Nenhum jogador ainda</p>';

  const statusBingo = document.getElementById('status-bingo');
  statusBingo.innerHTML = estado.jogadores.map((j,i) => {
    return `<div class="status-item" style="animation-delay:${i*0.04}s">
      <div>
        <div class="nome">${j.nome}</div>
        <div class="detalhe">${j.palavras.length} palavra(s) enviada(s)</div>
      </div>
      <div class="pontos">${j.pontosBingo} pts</div>
    </div>`;
  }).join('') || '<p style="color:var(--texto-fraco);">Nenhum jogador ainda</p>';

  const meuNome = localStorage.getItem('sb_nome_jogador');
  const eu = estado.jogadores.find(j => j.nome === meuNome);
  const listaPalavras = document.getElementById('palavras-enviadas-player');
  if(eu && listaPalavras){
    listaPalavras.innerHTML = eu.palavras.map(p => `<div class="palavra-chip">${p.letra}: ${p.palavra}</div>`).join('');
  }
}

socket.on('estado_inicial', aplicarEstado);
socket.on('estado_atualizado', aplicarEstado);

socket.on('bingo_valido', (dados) => {
  const linhas = dados.detalhes.map(d => `${d.letra}: "${d.palavra}" ✅`).join('\n');
  alert(`🎉 BINGO válido para ${dados.nome}!\n\n${linhas}\n\nPontos de Bingo: ${dados.pontosBingo}`);
});
socket.on('bingo_invalido', (dados) => {
  const linhas = dados.detalhes.map(d => `${d.letra}: "${d.palavra}" ${d.correta ? '✅' : `❌ (esperado: ${d.esperado || '—'})`}`).join('\n');
  alert(`❌ BINGO inválido para ${dados.nome}.\n\n${linhas}\n\nPontos de Bingo: ${dados.pontosBingo}`);
});
socket.on('erro_bingo', (dados) => {
  alert('⚠️ ' + dados.mensagem);
});

socket.on('solicitacao_bingo', (dados) => {
  const card = document.getElementById('card-notificacoes');
  card.style.display = 'block';
  const lista = document.getElementById('notificacoes-lista');
  const item = document.createElement('div');
  item.className = 'notificacao';
  item.innerHTML = `<span>🔔 <strong>${dados.nome}</strong> pediu BINGO!</span>
    <button class="btn-secundario btn-validar-rapido" data-nome="${dados.nome}">Validar</button>`;
  lista.prepend(item);
  item.querySelector('.btn-validar-rapido').addEventListener('click', () => {
    socket.emit('validar_bingo', dados.nome);
    item.remove();
  });
});

socket.on('jogo_finalizado', (ranking) => {
  mostrarTela('tela-podio');
  renderizarPodio(ranking);
  lancarConfetes();
});

function renderizarPodio(ranking){
  const container = document.getElementById('podio-container');
  const medalhas = ['🥇','🥈','🥉'];
  const classes = ['ouro','prata','bronze'];
  container.innerHTML = ranking.map((j, i) => {
    const pontos = estado && estado.jogo === 'stop' ? j.totalStop : j.pontosBingo;
    const classe = classes[i] || '';
    const medalha = medalhas[i] || `${i+1}º`;
    return `<div class="podio-item ${classe}" style="animation-delay:${i*0.15}s;">
      <div class="posicao">${medalha}</div>
      <div class="nome">${j.nome}</div>
      <div class="pontos">${pontos} pts</div>
    </div>`;
  }).join('');
}

function lancarConfetes(){
  const cont = document.getElementById('confetti-container');
  const cores = ['#e94560','#f4a261','#4ecdc4','#ffd700'];
  for(let i=0;i<100;i++){
    const c = document.createElement('div');
    c.className = 'confete';
    const tamanho = 6 + Math.random()*8;
    c.style.width = tamanho+'px';
    c.style.height = (tamanho*0.4)+'px';
    c.style.left = Math.random()*100+'vw';
    c.style.background = cores[Math.floor(Math.random()*cores.length)];
    c.style.animationDuration = (2.5 + Math.random()*2.5)+'s';
    cont.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}
</script>
</body>
