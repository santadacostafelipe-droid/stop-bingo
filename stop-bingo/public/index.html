<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stop & Bingo</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #0b0e1a, #1a1f33);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #fff;
        }
        .app {
            width: 100%;
            max-width: 1200px;
        }
        /* ===== TELAS ===== */
        .tela {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        .tela.ativa {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* ===== MENU INICIAL ===== */
        .menu-cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .card-jogo {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(255,255,255,0.06);
            border-radius: 40px;
            padding: 40px 30px;
            width: 260px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(8px);
        }
        .card-jogo:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: #e94560;
            box-shadow: 0 20px 40px rgba(233,69,96,0.2);
        }
        .card-jogo .icon { font-size: 64px; }
        .card-jogo h2 { font-size: 28px; margin-top: 10px; }
        .card-jogo p { color: rgba(255,255,255,0.5); margin-top: 8px; }
        /* ===== CONFIGURAÇÃO ===== */
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            background: rgba(255,255,255,0.04);
            border-radius: 32px;
            padding: 24px;
            margin-top: 20px;
        }
        .config-card {
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 20px;
        }
        .config-card h3 { margin-bottom: 12px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .input-group input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #fff;
            outline: none;
        }
        .input-group button {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #9c2a3f;
        }
        .lista-jogadores {
            max-height: 180px;
            overflow-y: auto;
        }
        .lista-jogadores .item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 40px;
            margin-bottom: 4px;
        }
        .lista-jogadores .item .remove {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
        }
        .btn-iniciar {
            background: #4ecdc4;
            border: none;
            color: #1a1f33;
            font-weight: 700;
            padding: 14px 40px;
            border-radius: 60px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2a7a73;
            margin-top: 20px;
        }
        /* ===== JOGO ===== */
        .jogo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .coluna-roleta {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-wrapper {
            border-radius: 50%;
            box-shadow: 0 0 0 6px #e94560;
            background: #111;
            padding: 8px;
            max-width: 400px;
            width: 100%;
        }
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: #fff;
        }
        .info-rodada {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0,0,0,0.35);
            padding: 10px 20px;
            border-radius: 60px;
            margin: 16px 0;
            width: 100%;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
        }
        .info-item .valor {
            background: #e94560;
            padding: 0 16px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 28px;
        }
        .info-item .tema-valor {
            background: #f4a261;
            color: #1a1f33;
            padding: 0 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 22px;
        }
        .btn-girar {
            background: #e94560;
            border: none;
            color: #fff;
            padding: 12px 36px;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #9c2a3f;
            margin: 8px 0;
            transition: 0.08s linear;
        }
        .btn-girar:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #9c2a3f; }
        .btn-girar:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c2a3f; }
        .btn-girar:disabled { opacity: 0.5; transform: translateY(4px); pointer-events: none; }

        .coluna-admin {
            background: rgba(255,255,255,0.04);
            border-radius: 32px;
            padding: 20px;
        }
        .coluna-admin h3 { margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 12px; }
        .admin-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .admin-controls .linha {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .admin-controls select, .admin-controls input {
            flex: 1;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #fff;
            outline: none;
        }
        .btn-admin {
            background: #f4a261;
            border: none;
            color: #1a1f33;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b36b3a;
            transition: 0.08s linear;
        }
        .btn-admin:hover { transform: translateY(-2px); }
        .btn-admin:active { transform: translateY(4px); box-shadow: 0 1px 0 #b36b3a; }
        .btn-admin.danger { background: #e63946; color: #fff; box-shadow: 0 4px 0 #9c2a3f; }
        .btn-admin.success { background: #4ecdc4; color: #1a1f33; box-shadow: 0 4px 0 #2a7a73; }
        .status-box {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 14px;
        }
        .status-box .linha-status {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .status-box .destaque { color: #4ecdc4; }

        /* ===== MODO JOGADOR (mobile) ===== */
        .modo-jogador {
            display: none;
            background: rgba(255,255,255,0.03);
            border-radius: 32px;
            padding: 20px;
            margin-top: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .modo-jogador .letra-grande {
            font-size: 72px;
            font-weight: 900;
            color: #e94560;
            text-shadow: 0 0 40px rgba(233,69,96,0.3);
        }
        .modo-jogador .tema-grande {
            font-size: 28px;
            font-weight: 700;
            color: #f4a261;
            background: rgba(244,162,97,0.1);
            padding: 2px 24px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 6px;
        }
        .modo-jogador .botoes-pontos {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
        }
        .modo-jogador .botoes-pontos button {
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .modo-jogador .botoes-pontos button.selecionado {
            background: #e94560;
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233,69,96,0.3);
        }
        .modo-jogador .input-palavra {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 16px 0;
        }
        .modo-jogador .input-palavra input {
            flex: 1;
            max-width: 280px;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 18px;
            outline: none;
        }
        .modo-jogador .input-palavra button {
            background: #4ecdc4;
            border: none;
            color: #1a1f33;
            font-weight: 700;
            padding: 0 28px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2a7a73;
        }
        .modo-jogador .btn-bingo {
            background: #ffd700;
            border: none;
            color: #1a1f33;
            font-weight: 900;
            padding: 14px 40px;
            border-radius: 60px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b8960f;
            margin-top: 10px;
            transition: 0.08s linear;
        }
        .modo-jogador .btn-bingo:active { transform: translateY(6px); box-shadow: 0 2px 0 #b8960f; }

        /* ===== PÓDIO ===== */
        .podium-lista {
            list-style: none;
            max-width: 500px;
            margin: 20px auto;
        }
        .podium-lista li {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 60px;
            margin-bottom: 8px;
            border-left: 6px solid #e94560;
            font-size: 20px;
            animation: slideIn 0.4s ease-out both;
        }
        .podium-lista li:nth-child(1) { border-left-color: #ffd700; background: rgba(255,215,0,0.12); animation-delay: 0.1s; }
        .podium-lista li:nth-child(2) { border-left-color: #c0c0c0; background: rgba(192,192,192,0.08); animation-delay: 0.2s; }
        .podium-lista li:nth-child(3) { border-left-color: #cd7f32; background: rgba(205,127,50,0.08); animation-delay: 0.3s; }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .config-grid { grid-template-columns: 1fr; }
            .jogo-grid { grid-template-columns: 1fr; }
            .modo-jogador { display: block; }
            .coluna-admin { order: 2; }
            .coluna-roleta { order: 1; }
        }
        .flex-center { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .mt-16 { margin-top: 16px; }
        .mb-12 { margin-bottom: 12px; }
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        h1 {
            font-size: 48px;
            text-align: center;
            background: linear-gradient(135deg, #e94560, #f4a261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- ========== TELA INICIAL ========== -->
    <div id="telaInicial" class="tela ativa">
        <h1>🎲 Stop & Bingo</h1>
        <p class="subtitle">Escolha o jogo e divirta-se!</p>
        <div class="menu-cards">
            <div class="card-jogo" data-jogo="stop">
                <div class="icon">🛑</div>
                <h2>Stop</h2>
                <p>Gire, marque pontos por tema, veja o pódio</p>
            </div>
            <div class="card-jogo" data-jogo="bingo">
                <div class="icon">🎰</div>
                <h2>Bingo</h2>
                <p>Gire, escreva palavras, valide e ganhe pontos</p>
            </div>
        </div>
    </div>

    <!-- ========== TELA DE CONFIGURAÇÃO ========== -->
    <div id="telaConfig" class="tela">
        <h2 id="configTitulo" class="text-center" style="font-size:32px;">⚙️ Configurar</h2>
        <div class="config-grid">
            <div class="config-card">
                <h3>👥 Jogadores</h3>
                <div class="input-group">
                    <input type="text" id="inputNome" placeholder="Nome do jogador" />
                    <button id="btnAddJogador">+</button>
                </div>
                <div class="lista-jogadores" id="listaJogadoresConfig"></div>
            </div>
            <div class="config-card" id="configEspecifica">
                <h3 id="configEspecificaTitulo">📂 Configurações</h3>
                <div id="configEspecificaConteudo"></div>
            </div>
        </div>
        <div class="flex-center mt-16">
            <button class="btn-iniciar" id="btnIniciarJogo">🚀 Iniciar Jogo</button>
        </div>
    </div>

    <!-- ========== TELA DO JOGO ========== -->
    <div id="telaJogo" class="tela">
        <div class="jogo-grid">
            <!-- Coluna esquerda: roleta -->
            <div class="coluna-roleta">
                <div class="canvas-wrapper">
                    <canvas id="roletaCanvas" width="500" height="500"></canvas>
                </div>
                <div class="info-rodada">
                    <div class="info-item">
                        <span>🎯</span>
                        <span class="valor" id="letraAtual">?</span>
                    </div>
                    <div class="info-item">
                        <span>📂</span>
                        <span class="tema-valor" id="temaAtual">Nenhum</span>
                    </div>
                    <div class="info-item">
                        <span>⏳</span>
                        <span class="valor" id="rodadaAtual" style="background:#f4a261;color:#1a1f33;">0</span>
                    </div>
                </div>
                <button class="btn-girar" id="btnGirar">🔄 Girar Roleta</button>

                <!-- MODO JOGADOR (mobile) -->
                <div class="modo-jogador" id="modoJogador">
                    <div class="letra-grande" id="jogadorLetra">?</div>
                    <div class="tema-grande" id="jogadorTema">Tema</div>
                    <div id="jogadorAcoes"></div>
                </div>
            </div>

            <!-- Coluna direita: admin -->
            <div class="coluna-admin">
                <h3>🎮 Painel do Administrador</h3>
                <div class="admin-controls" id="adminControls">
                    <!-- preenchido dinamicamente -->
                </div>
                <div class="status-box" id="statusBox">
                    <div style="color:rgba(255,255,255,0.3); text-align:center;">Aguardando...</div>
                </div>
                <div class="flex-center mt-16">
                    <button class="btn-admin danger" id="btnFinalizar">🏁 Finalizar</button>
                    <button class="btn-admin" id="btnVoltarConfig">⬅ Config</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== PÓDIO ========== -->
    <div id="telaPodium" class="tela">
        <h2 class="text-center" style="font-size:40px;">🏆 Pódio</h2>
        <ul class="podium-lista" id="podiumLista"></ul>
        <div class="flex-center">
            <button class="btn-admin" id="btnVoltarInicio">⬅ Voltar ao início</button>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // CLIENTE SOCKET
    // ================================================================
    const socket = io();
    let estadoAtual = null;
    let meuNome = null; // armazena o nome do jogador atual (para marcar pontos)

    // ================================================================
    // DOM REFS
    // ================================================================
    const $ = id => document.getElementById(id);
    const telaInicial = $('telaInicial');
    const telaConfig = $('telaConfig');
    const telaJogo = $('telaJogo');
    const telaPodium = $('telaPodium');
    const configTitulo = $('configTitulo');
    const configEspecifica = $('configEspecifica');
    const configEspecificaTitulo = $('configEspecificaTitulo');
    const configEspecificaConteudo = $('configEspecificaConteudo');
    const inputNome = $('inputNome');
    const btnAddJogador = $('btnAddJogador');
    const listaJogadoresConfig = $('listaJogadoresConfig');
    const btnIniciarJogo = $('btnIniciarJogo');
    const canvas = $('roletaCanvas');
    const ctx = canvas.getContext('2d');
    const letraAtualEl = $('letraAtual');
    const temaAtualEl = $('temaAtual');
    const rodadaAtualEl = $('rodadaAtual');
    const btnGirar = $('btnGirar');
    const adminControls = $('adminControls');
    const statusBox = $('statusBox');
    const btnFinalizar = $('btnFinalizar');
    const btnVoltarConfig = $('btnVoltarConfig');
    const jogadorLetra = $('jogadorLetra');
    const jogadorTema = $('jogadorTema');
    const jogadorAcoes = $('jogadorAcoes');
    const podiumLista = $('podiumLista');
    const btnVoltarInicio = $('btnVoltarInicio');

    // ================================================================
    // ROLETA (canvas)
    // ================================================================
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    const raio = 220;
    const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const N = letras.length;
    const anguloFatia = (2 * Math.PI) / N;
    const cores = letras.map((_, i) => (i % 2 === 0) ? '#ffffff' : '#e63946');

    let rotacaoAtual = 0;
    let girando = false;
    let animId = null;

    function desenharRoleta(rotacao) {
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < N; i++) {
            const inicio = i * anguloFatia + rotacao;
            const fim = inicio + anguloFatia;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, raio, inicio, fim);
            ctx.closePath();
            ctx.fillStyle = cores[i];
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            const anguloMedio = inicio + anguloFatia/2;
            const distTexto = raio * 0.72;
            const xTexto = cx + Math.cos(anguloMedio) * distTexto;
            const yTexto = cy + Math.sin(anguloMedio) * distTexto;
            ctx.save();
            ctx.translate(xTexto, yTexto);
            ctx.rotate(anguloMedio + (anguloMedio > Math.PI/2 ? Math.PI : 0));
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = (cores[i] === '#ffffff') ? '#111' : '#fff';
            ctx.font = 'bold 22px "Segoe UI", Arial, sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 4;
            ctx.fillText(letras[i], 0, 0);
            ctx.shadowBlur = 0;
            ctx.restore();
        }
        // centro
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 40);
        grad.addColorStop(0, '#f0f0f0');
        grad.addColorStop(0.7, '#c0c0c0');
        grad.addColorStop(1, '#888');
        ctx.beginPath();
        ctx.arc(cx, cy, 35, 0, 2*Math.PI);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, 2*Math.PI);
        ctx.fillStyle = '#e94560';
        ctx.fill();
        // ponteiro
        const pontaY = 15, baseY = 45, baseLarg = 30;
        ctx.beginPath();
        ctx.moveTo(cx, pontaY);
        ctx.lineTo(cx - baseLarg/2, baseY);
        ctx.lineTo(cx + baseLarg/2, baseY);
        ctx.closePath();
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = 'rgba(255,215,0,0.7)';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#b8860b';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function getLetraNoTopo(rotacao) {
        const anguloPonteiro = -Math.PI/2;
        let ponteiroNormalizado = ((anguloPonteiro % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
        let indice = (ponteiroNormalizado - rotacao) / anguloFatia;
        indice = ((indice % N) + N) % N;
        return Math.floor(indice);
    }

    // Inicializa roleta com A no topo
    let rotInicial = -Math.PI/2 - anguloFatia/2;
    rotInicial = ((rotInicial % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
    rotacaoAtual = rotInicial;
    desenharRoleta(rotacaoAtual);

    // ================================================================
    // NAVEGAÇÃO ENTRE TELAS
    // ================================================================
    function mostrarTela(id) {
        document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
        document.getElementById(id).classList.add('ativa');
    }

    // ================================================================
    // MENU INICIAL -> CONFIG
    // ================================================================
    document.querySelectorAll('.card-jogo').forEach(card => {
        card.addEventListener('click', function() {
            const jogo = this.dataset.jogo;
            socket.emit('set_jogo', jogo);
            configTitulo.textContent = jogo === 'stop' ? '⚙️ Configurar Stop' : '⚙️ Configurar Bingo';
            if (jogo === 'stop') {
                configEspecificaTitulo.textContent = '📂 Temas (8)';
                configEspecificaConteudo.innerHTML = `
                    <p style="color:rgba(255,255,255,0.6);">Temas: Person, Food, Place, Color, Job, Verb, Object, Animal</p>
                    <div style="margin-top:8px;">
                        <label style="color:rgba(255,255,255,0.5);">Tema inicial:</label>
                        <select id="selectTemaStop" style="width:100%; padding:8px; border-radius:40px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff; margin-top:4px;">
                            ${['Person','Food','Place','Color','Job','Verb','Object','Animal'].map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                `;
            } else {
                configEspecificaTitulo.textContent = '📂 Tema do Bingo';
                configEspecificaConteudo.innerHTML = `
                    <p style="color:rgba(255,255,255,0.6);">Escolha o tema para as palavras.</p>
                    <div style="margin-top:8px;">
                        <label style="color:rgba(255,255,255,0.5);">Tema:</label>
                        <select id="selectTemaBingo" style="width:100%; padding:8px; border-radius:40px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#fff; margin-top:4px;">
                            ${['Person','Food','Place','Color','Job','Verb','Object','Animal'].map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                `;
            }
            mostrarTela('telaConfig');
        });
    });

    // ================================================================
    // GERENCIAR JOGADORES (socket)
    // ================================================================
    function renderizarListaJogadores(jogadores) {
        listaJogadoresConfig.innerHTML = '';
        if (!jogadores || jogadores.length === 0) {
            listaJogadoresConfig.innerHTML = '<div style="color:rgba(255,255,255,0.2);text-align:center;padding:12px;">Nenhum jogador</div>';
            return;
        }
        jogadores.forEach(j => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <span>${j.nome}</span>
                <button class="remove" data-nome="${j.nome}">✕</button>
            `;
            div.querySelector('.remove').addEventListener('click', function() {
                socket.emit('remover_jogador', this.dataset.nome);
            });
            listaJogadoresConfig.appendChild(div);
        });
    }

    btnAddJogador.addEventListener('click', function() {
        const nome = inputNome.value.trim();
        if (!nome) { alert('Digite um nome.'); return; }
        socket.emit('adicionar_jogador', nome);
        inputNome.value = '';
    });
    inputNome.addEventListener('keydown', e => { if (e.key === 'Enter') btnAddJogador.click(); });

    // ================================================================
    // INICIAR JOGO
    // ================================================================
    btnIniciarJogo.addEventListener('click', function() {
        const selectTemaStop = document.getElementById('selectTemaStop');
        const selectTemaBingo = document.getElementById('selectTemaBingo');
        if (selectTemaStop) socket.emit('mudar_tema_stop', selectTemaStop.value);
        if (selectTemaBingo) socket.emit('set_tema_bingo', selectTemaBingo.value);
        mostrarTela('telaJogo');
        // Forçar atualização da UI
        if (estadoAtual) atualizarUI(estadoAtual);
    });

    // ================================================================
    // RECEBER ESTADO DO SERVIDOR
    // ================================================================
    socket.on('estado_inicial', (estado) => {
        estadoAtual = estado;
        atualizarUI(estado);
        renderizarListaJogadores(estado.jogadores);
        if (document.getElementById('telaJogo').classList.contains('ativa')) {
            montarAdminControls(estado);
            atualizarStatus(estado);
        }
    });

    socket.on('estado_atualizado', (estado) => {
        estadoAtual = estado;
        atualizarUI(estado);
        renderizarListaJogadores(estado.jogadores);
        if (document.getElementById('telaJogo').classList.contains('ativa')) {
            montarAdminControls(estado);
            atualizarStatus(estado);
            atualizarModoJogador(estado);
        }
    });

    socket.on('jogo_finalizado', () => {
        if (!estadoAtual) return;
        const ranking = [...estadoAtual.jogadores].sort((a,b) => b.pontos - a.pontos);
        podiumLista.innerHTML = '';
        ranking.forEach((j, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${i+1}º</span><span>${j.nome}</span><span>${j.pontos} pts</span>`;
            podiumLista.appendChild(li);
        });
        mostrarTela('telaPodium');
        // confetti (se disponível)
        if (typeof confetti !== 'undefined') {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            setTimeout(() => confetti({ particleCount: 100, spread: 50, origin: { y: 0.4 } }), 300);
        }
    });

    socket.on('bingo_valido', ({ jogador, feedback }) => {
        alert(`🎉 BINGO VÁLIDO! ${jogador} ganhou 1 ponto.\n\n${feedback}`);
    });
    socket.on('bingo_invalido', (feedback) => {
        alert(`❌ BINGO INVÁLIDO! Você perdeu 1 ponto.\n\n${feedback}`);
    });
    socket.on('erro_bingo', (msg) => { alert(msg); });

    // ================================================================
    // ATUALIZAR UI GERAL
    // ================================================================
    function atualizarUI(estado) {
        letraAtualEl.textContent = estado.letraAtual || '?';
        if (estado.jogo === 'stop') {
            temaAtualEl.textContent = estado.temaSelecionado || 'Nenhum';
        } else {
            temaAtualEl.textContent = estado.temaBingo || 'Nenhum';
        }
        rodadaAtualEl.textContent = estado.rodada || 0;
        // Atualiza modo jogador
        atualizarModoJogador(estado);
    }

    // ================================================================
    // MODO JOGADOR
    // ================================================================
    function atualizarModoJogador(estado) {
        jogadorLetra.textContent = estado.letraAtual || '?';
        if (estado.jogo === 'stop') {
            jogadorTema.textContent = estado.temaSelecionado || 'Tema';
        } else {
            jogadorTema.textContent = estado.temaBingo || 'Tema';
        }

        if (estado.jogo === 'stop') {
            jogadorAcoes.innerHTML = `
                <div class="botoes-pontos">
                    <button class="btn-ponto" data-pontos="10">10</button>
                    <button class="btn-ponto" data-pontos="5">5</button>
                    <button class="btn-ponto" data-pontos="0">0</button>
                </div>
                <div style="font-size:14px; color:rgba(255,255,255,0.3);">Selecione os pontos que você fez neste tema.</div>
            `;
            document.querySelectorAll('.btn-ponto').forEach(btn => {
                btn.addEventListener('click', function() {
                    const pontos = parseInt(this.dataset.pontos);
                    // Pede o nome do jogador (só na primeira vez)
                    if (!meuNome) {
                        const nome = prompt('Digite seu nome:');
                        if (!nome) return;
                        meuNome = nome;
                    }
                    socket.emit('marcar_ponto_stop', {
                        jogador: meuNome,
                        tema: estado.temaSelecionado,
                        pontos: pontos
                    });
                    document.querySelectorAll('.btn-ponto').forEach(b => b.classList.remove('selecionado'));
                    this.classList.add('selecionado');
                });
            });
        } else { // Bingo
            // Para o Bingo, o jogador vê a letra, o tema, um campo para escrever a palavra
            // e um botão BINGO.
            jogadorAcoes.innerHTML = `
                <div style="margin-bottom:10px;">
                    <div style="font-size:14px; color:rgba(255,255,255,0.4);">Escreva uma palavra que comece com a letra e pertença ao tema.</div>
                    <div class="input-palavra">
                        <input type="text" id="inputPalavraBingo" placeholder="Palavra" />
                        <button id="btnEnviarPalavraBingo">Enviar</button>
                    </div>
                </div>
                <button class="btn-bingo" id="btnBingoJogador">🎰 BINGO!</button>
            `;
            document.getElementById('btnEnviarPalavraBingo').addEventListener('click', function() {
                const palavra = document.getElementById('inputPalavraBingo').value.trim();
                if (!palavra) { alert('Digite uma palavra.'); return; }
                if (!meuNome) {
                    const nome = prompt('Digite seu nome:');
                    if (!nome) return;
                    meuNome = nome;
                }
                // Envia a palavra para o servidor (associada ao jogador)
                // Mas no Bingo, a palavra é para a letra atual.
                // O servidor armazena a palavra para validação.
                socket.emit('enviar_palavra_bingo', {
                    jogador: meuNome,
                    palavra: palavra,
                    letra: estado.letraAtual
                });
                document.getElementById('inputPalavraBingo').value = '';
                alert('Palavra enviada!');
            });
            document.getElementById('btnBingoJogador').addEventListener('click', function() {
                if (!meuNome) {
                    const nome = prompt('Digite seu nome:');
                    if (!nome) return;
                    meuNome = nome;
                }
                // O jogador clicou em BINGO: solicita validação ao admin.
                // O admin recebe um pedido e vai validar.
                socket.emit('solicitar_validacao_bingo', meuNome);
                alert('Solicitação de BINGO enviada ao administrador.');
            });
        }
    }

    // ================================================================
    // ADMIN CONTROLS
    // ================================================================
    function montarAdminControls(estado) {
        if (!estado) return;
        if (estado.jogo === 'stop') {
            adminControls.innerHTML = `
                <div class="linha">
                    <label>Tema:</label>
                    <select id="selectTemaAdmin">
                        ${['Person','Food','Place','Color','Job','Verb','Object','Animal'].map(t => 
                            `<option value="${t}" ${t === estado.temaSelecionado ? 'selected' : ''}>${t}</option>`
                        ).join('')}
                    </select>
                    <button class="btn-admin" id="btnMudarTemaAdmin">Alterar</button>
                </div>
                <div class="linha">
                    <button class="btn-admin success" id="btnProximaRodada">⏭ Próxima rodada</button>
                    <button class="btn-admin danger" id="btnZerarPontos">🔄 Zerar pontos</button>
                </div>
                <div id="adminBingoContainer"></div>
            `;
            document.getElementById('btnMudarTemaAdmin').addEventListener('click', function() {
                const tema = document.getElementById('selectTemaAdmin').value;
                socket.emit('mudar_tema_stop', tema);
            });
            document.getElementById('btnProximaRodada').addEventListener('click', function() {
                socket.emit('proxima_rodada_stop');
            });
            document.getElementById('btnZerarPontos').addEventListener('click', function() {
                if (confirm('Zerar todos os pontos?')) socket.emit('zerar_pontos_stop');
            });
        } else { // Bingo
            adminControls.innerHTML = `
                <div class="linha">
                    <label>Tema:</label>
                    <span style="color:#f4a261; font-weight:700;">${estado.temaBingo || 'Nenhum'}</span>
                </div>
                <div class="linha">
                    <button class="btn-admin success" id="btnValidarBingoAdmin">✅ Validar Bingo</button>
                </div>
                <div id="adminBingoContainer"></div>
            `;
            document.getElementById('btnValidarBingoAdmin').addEventListener('click', function() {
                // O admin vai validar o bingo do jogador que pediu
                // Vamos abrir um prompt para o admin digitar as palavras da linha/coluna.
                // Mas para simplificar, vamos pedir o nome do jogador e depois as palavras.
                const jogador = prompt('Nome do jogador que pediu BINGO:');
                if (!jogador) return;
                // Pede as palavras para cada letra da linha/coluna (o servidor já tem as palavras enviadas, mas podemos pedir novamente)
                // Na verdade, o servidor já armazenou as palavras enviadas pelo jogador.
                // Então podemos simplesmente solicitar a validação no servidor.
                socket.emit('validar_bingo', jogador);
            });
        }
    }

    // ================================================================
    // STATUS
    // ================================================================
    function atualizarStatus(estado) {
        let html = '';
        if (estado.jogo === 'stop') {
            html = `<div style="font-weight:600; margin-bottom:8px;">📊 Pontuação (tema: ${estado.temaSelecionado})</div>`;
            estado.jogadores.forEach(j => {
                const pts = estado.pontosStop[j.nome]?.[estado.temaSelecionado] || 0;
                html += `<div class="linha-status"><span>${j.nome}</span><span>${pts} pts</span></div>`;
            });
            html += `<div style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.04); padding-top:8px; font-weight:600;">Total</div>`;
            estado.jogadores.forEach(j => {
                const total = Object.values(estado.pontosStop[j.nome] || {}).reduce((a,b) => a+b, 0);
                html += `<div class="linha-status"><span>${j.nome}</span><span>${total} pts</span></div>`;
            });
        } else {
            html = `<div style="font-weight:600;">🎰 Bingo - Tema: ${estado.temaBingo}</div>`;
            estado.jogadores.forEach(j => {
                html += `<div class="linha-status"><span>${j.nome}</span><span>${j.pontos} pts</span></div>`;
            });
        }
        statusBox.innerHTML = html;
    }

    // ================================================================
    // BOTÕES GLOBAIS
    // ================================================================
    btnGirar.addEventListener('click', function() {
        socket.emit('girar_roleta');
    });

    btnFinalizar.addEventListener('click', function() {
        if (confirm('Finalizar jogo e ir para o pódio?')) {
            socket.emit('finalizar_jogo');
        }
    });

    btnVoltarConfig.addEventListener('click', function() {
        if (confirm('Voltar à configuração? O progresso será perdido.')) {
            mostrarTela('telaConfig');
        }
    });

    btnVoltarInicio.addEventListener('click', function() {
        mostrarTela('telaInicial');
    });

    // ================================================================
    // INICIALIZAÇÃO
    // ================================================================
    mostrarTela('telaInicial');
    console.log('Cliente pronto.');
</script>
</body>
</html>
